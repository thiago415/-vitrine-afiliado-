<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkVitrine Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--primary:#6366f1;--primary-d:#4f46e5;--secondary:#ec4899;--success:#10b981;--danger:#ef4444;--bg:#0a0a14;--bg2:#111120;--bg3:#1a1a2e;--card:#13131f;--border:rgba(255,255,255,0.08);--t1:#f1f1ff;--t2:#8888a8;--t3:#4a4a6a;--radius:12px;--tr:all .25s ease}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
input,select,textarea{font-family:inherit;color:var(--t1);outline:none;width:100%}
img{max-width:100%;display:block}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--primary);border-radius:3px}
.hidden{display:none!important}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* SIDEBAR */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:200;transition:transform .3s}
.sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:18px 16px;border-bottom:1px solid var(--border)}
.logo{font-size:1.1rem;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.close-sidebar{width:30px;height:30px;border-radius:50%;background:var(--border);display:none;align-items:center;justify-content:center;color:var(--t2);font-size:.85rem}
.sidebar nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;color:var(--t2);font-size:.9rem;font-weight:500;transition:var(--tr);cursor:pointer}
.nav-item i{width:18px;text-align:center}
.nav-item:hover{background:rgba(255,255,255,.05);color:var(--t1)}
.nav-item.active{background:rgba(99,102,241,.15);color:var(--primary);font-weight:600}
.sidebar-footer{padding:14px;border-top:1px solid var(--border)}
.btn-preview{width:100%;padding:11px;background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;border-radius:10px;font-size:.88rem;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}

/* OVERLAY */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:199}
.overlay.show{display:block}

/* MAIN */
.main{margin-left:240px;min-height:100vh;transition:margin .3s}
.topbar{position:sticky;top:0;height:58px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 20px;z-index:100}
.menu-btn{width:36px;height:36px;border-radius:8px;background:var(--border);display:none;align-items:center;justify-content:center;color:var(--t2);font-size:.95rem}
.page-title{font-weight:700;font-size:1rem;flex:1}
.topbar-right{display:flex;gap:8px}
.btn-icon{width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--t2);font-size:.9rem;transition:var(--tr)}
.btn-icon:hover{border-color:var(--primary);color:var(--primary)}

.content{padding:0}
.page{padding:24px;animation:fadeIn .3s ease}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.page-header h1{font-size:1.4rem;font-weight:800;margin-bottom:4px}
.page-header p{color:var(--t2);font-size:.88rem}

/* BUTTONS */
.btn-primary{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;border-radius:10px;font-weight:600;font-size:.88rem;transition:var(--tr);white-space:nowrap}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(99,102,241,.4)}
.btn-ghost{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border:1px solid var(--border);color:var(--t2);border-radius:10px;font-size:.88rem;font-weight:500;transition:var(--tr)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-danger{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;background:rgba(239,68,68,.12);color:var(--danger);border:1px solid rgba(239,68,68,.25);border-radius:10px;font-size:.88rem;font-weight:600}
.btn-block{width:100%;justify-content:center}

/* DASHBOARD */
.welcome-box{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(236,72,153,.1));border:1px solid rgba(99,102,241,.2);border-radius:16px;padding:24px;margin-bottom:24px;flex-wrap:wrap;gap:16px}
.welcome-box h1{font-size:1.5rem;font-weight:800;margin-bottom:6px}
.welcome-box p{color:var(--t2)}
.cards-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.card-stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;align-items:center;gap:14px;transition:var(--tr)}
.card-stat:hover{border-color:var(--primary);transform:translateY(-3px)}
.card-stat-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1.1rem}
.card-stat-num{font-size:1.5rem;font-weight:800;line-height:1}
.card-stat-label{font-size:.78rem;color:var(--t2);margin-top:2px}
.section-title{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin-bottom:14px;margin-top:8px}
.acoes-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
.acao-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:.88rem;font-weight:600;color:var(--t2);transition:var(--tr);text-align:center}
.acao-card i{font-size:1.3rem;color:var(--primary)}
.acao-card:hover{border-color:var(--primary);color:var(--t1);transform:translateY(-3px)}

/* FORM */
.form-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:20px;animation:fadeIn .3s ease}
.form-box-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.form-box-header h3{font-size:.95rem;font-weight:700}
.form-box-header button{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;color:var(--t2);font-size:.8rem}
.form-box-header button:hover{background:var(--danger);color:#fff}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.campo{display:flex;flex-direction:column;gap:5px}
.campo.full{grid-column:1/-1}
.campo label{font-size:.75rem;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.5px}
.campo input,.campo select,.campo textarea{padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;font-size:.9rem;transition:var(--tr)}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--primary)}
.campo textarea{resize:vertical;min-height:80px}
.form-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}

.cor-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cor-row input[type=color]{width:36px;height:36px;border:2px solid var(--border);border-radius:8px;cursor:pointer;padding:2px;background:none}
.cores-rapidas{display:flex;gap:6px;flex-wrap:wrap}
.cores-rapidas span{width:22px;height:22px;border-radius:50%;cursor:pointer;transition:var(--tr);border:2px solid transparent;display:inline-block}
.cores-rapidas span:hover{transform:scale(1.25);border-color:#fff}

.toggle-label{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:.88rem;color:var(--t2)}
.toggle-label input{display:none;width:auto}
.toggle-switch{width:38px;height:21px;background:var(--bg3);border:1px solid var(--border);border-radius:11px;position:relative;transition:var(--tr);flex-shrink:0}
.toggle-switch::after{content:'';position:absolute;left:3px;top:3px;width:13px;height:13px;background:var(--t3);border-radius:50%;transition:var(--tr)}
.toggle-label input:checked+.toggle-switch{background:var(--primary);border-color:var(--primary)}
.toggle-label input:checked+.toggle-switch::after{left:20px;background:#fff}

/* LINKS */
.link-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;transition:var(--tr);animation:fadeIn .3s ease}
.link-item:hover{border-color:var(--primary)}
.link-icone{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1rem;flex-shrink:0}
.link-info{flex:1;min-width:0}
.link-titulo{font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-url{font-size:.75rem;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-acoes{display:flex;gap:6px;flex-shrink:0}
.btn-acao{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.8rem;transition:var(--tr)}
.btn-editar{background:rgba(99,102,241,.1);color:var(--primary)}
.btn-editar:hover{background:var(--primary);color:#fff}
.btn-deletar{background:rgba(239,68,68,.1);color:var(--danger)}
.btn-deletar:hover{background:var(--danger);color:#fff}
.btn-toggle{color:var(--t3);background:rgba(255,255,255,.04)}
.btn-toggle.ativo{color:var(--success)}

/* EMPTY */
.empty-state{text-align:center;padding:50px 20px}
.empty-icon{font-size:3rem;margin-bottom:14px}
.empty-state h3{font-size:1rem;font-weight:700;margin-bottom:8px}
.empty-state p{color:var(--t2);font-size:.88rem;margin-bottom:18px}

/* PRODUTOS */
.tabs-mini{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tab-mini{padding:8px 18px;border-radius:50px;font-size:.85rem;font-weight:600;color:var(--t2);background:rgba(255,255,255,.05);border:1px solid var(--border);transition:var(--tr)}
.tab-mini.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.link-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.link-row-icone{font-size:1.4rem;flex-shrink:0}
.link-row input{flex:1;min-width:200px;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;font-size:.9rem}
.btn-buscar{padding:10px 16px;background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;border-radius:8px;font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.filtro{padding:7px 16px;border-radius:50px;font-size:.82rem;font-weight:500;color:var(--t2);background:rgba(255,255,255,.04);border:1px solid var(--border);transition:var(--tr)}
.filtro:hover{border-color:var(--primary);color:var(--primary)}
.filtro.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.prod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.prod-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:var(--tr);animation:fadeIn .3s ease}
.prod-card:hover{border-color:var(--primary);transform:translateY(-4px)}
.prod-img{height:170px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:2.5rem;position:relative;overflow:hidden}
.prod-img img{width:100%;height:100%;object-fit:cover}
.prod-loja{position:absolute;bottom:8px;right:8px;padding:3px 9px;border-radius:50px;font-size:.7rem;font-weight:700}
.prod-desc{position:absolute;top:8px;left:8px;background:var(--danger);color:#fff;padding:3px 8px;border-radius:50px;font-size:.7rem;font-weight:700}
.prod-body{padding:14px}
.prod-nome{font-size:.88rem;font-weight:700;line-height:1.35;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.4em}
.prod-preco{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.preco-de{font-size:.78rem;color:var(--t3);text-decoration:line-through}
.preco-por{font-size:1.1rem;font-weight:800;color:var(--success)}
.prod-acoes{display:flex;gap:8px}

/* IMPORTAR */
.import-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.import-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;transition:var(--tr)}
.import-card:hover{border-color:var(--primary)}
.import-card.destaque{grid-column:1/-1;border-color:rgba(99,102,241,.3);background:rgba(99,102,241,.04)}
.import-card-header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.import-logo{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:1.3rem}
.import-card-header h3{font-size:.95rem;font-weight:700}
.import-card p{color:var(--t2);font-size:.85rem;margin-bottom:12px}
.badge-verde{display:inline-block;padding:2px 8px;background:rgba(16,185,129,.15);color:var(--success);border-radius:50px;font-size:.7rem;font-weight:600;margin-top:2px}
.input-import{padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;font-size:.88rem;margin-bottom:10px;transition:var(--tr)}
